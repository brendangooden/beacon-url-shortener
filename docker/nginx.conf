# The SPA is built with base "/admin/". Traefik strips the "/admin" prefix before it reaches nginx,
# so nginx serves from root with a standard SPA fallback; an unstripped /admin is rewritten below.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tolerate large request headers (accumulated cookies, big Authorization headers) instead of
    # returning "400 Request Header Or Cookie Too Large". Default is 8k, which auth cookies can exceed.
    large_client_header_buffers 8 32k;
    client_header_buffer_size 16k;

    # Some proxies forward /admin unstripped (e.g. Nginx Proxy Manager custom locations). Strip it
    # here too, so the SPA works whether or not the proxy in front removed the prefix.
    location = /admin {
        rewrite ^ / last;
    }
    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ /$1 last;
    }

    # Long-cache content-hashed build assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Release manifest — must never be cached, so an open tab can detect a new deploy.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # SPA fallback: every unknown path returns index.html so client routing works on deep links.
    # index.html must NOT be cached — it references content-hashed bundles, so a stale shell would
    # keep serving an old build after a deploy (exactly why a new release can look "not deployed").
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
