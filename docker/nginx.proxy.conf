# Single-origin reverse proxy for the sample docker-compose stack.
# Routes one public origin to the two app containers:
#   /admin/*  -> the SPA (web), with the /admin prefix stripped
#   /*        -> the API (redirects at /{code}, management at /api/*, /health)
# In a real deployment you'd terminate TLS here (or at your own proxy/CDN) instead.
server {
    listen 80;
    server_name _;

    # Tolerate large request headers (accumulated auth cookies) instead of a 400 header-too-large.
    large_client_header_buffers 8 32k;
    client_header_buffer_size 16k;

    # Admin SPA. The SPA is built with base "/admin/"; strip it so nginx (web) serves from root.
    location /admin/ {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
    }
    location = /admin {
        return 302 /admin/;
    }

    # Everything else is the API: /{code} redirects, /api/*, /health.
    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
