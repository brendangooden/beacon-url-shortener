<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beacon">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233A"/>
      <stop offset="1" stop-color="#0E1726"/>
    </linearGradient>
    <linearGradient id="tower" x1="202" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="0.55" stop-color="#DDE5F0"/>
      <stop offset="1" stop-color="#C2CDDD"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="150" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBC64B"/>
      <stop offset="1" stop-color="#E8A317"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="172" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5B733" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#E8A317" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E8A317" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="towerClip">
      <path d="M228 190 H284 L310 398 H202 Z"/>
    </clipPath>
  </defs>

  <!-- app field -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#dusk)"/>

  <!-- beacon glow -->
  <circle cx="256" cy="172" r="150" fill="url(#glow)"/>

  <!-- light rays (amber), fanning upward from the lantern -->
  <g stroke="#F5B733" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="72"/>
    <line x1="214" y1="130" x2="182" y2="94"/>
    <line x1="298" y1="130" x2="330" y2="94"/>
    <line x1="188" y1="164" x2="146" y2="150"/>
    <line x1="324" y1="164" x2="366" y2="150"/>
  </g>

  <!-- lantern roof -->
  <path d="M256 132 L286 162 H226 Z" fill="#C2CDDD"/>
  <!-- lantern (the light) -->
  <rect x="230" y="160" width="52" height="34" rx="6" fill="url(#amber)"/>

  <!-- tower -->
  <path d="M228 190 H284 L310 398 H202 Z" fill="url(#tower)"/>
  <!-- amber signal band -->
  <g clip-path="url(#towerClip)">
    <rect x="196" y="286" width="120" height="34" fill="url(#amber)"/>
  </g>

  <!-- base / rock -->
  <rect x="184" y="398" width="144" height="26" rx="10" fill="#AEB9CB"/>
  <rect x="168" y="420" width="176" height="18" rx="9" fill="#7E8AA0"/>
</svg>
