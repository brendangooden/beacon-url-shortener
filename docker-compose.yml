# Self-contained sample stack: Postgres + Redis + API + admin SPA, behind a small
# single-origin reverse proxy. Build + run the whole thing with:
#
#   docker compose up --build
#
# Then open http://localhost:8080/admin  (the SPA) — short links resolve at
# http://localhost:8080/{code}.
#
# This is a starting point, not a hardened deployment:
#   * No TLS — put your own reverse proxy / CDN in front for HTTPS in production.
#   * With no Entra config the API runs the built-in Dev auth provider, which
#     authenticates every request as a local user (the admin surface is open).
#     Set the AzureAd__* / VITE_ENTRA_* values below to require real sign-in.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: beacon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on: [db, cache]
    environment:
      ConnectionStrings__beacon: "Host=db;Database=beacon;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      ConnectionStrings__cache: "cache:6379"
      ASPNETCORE_ENVIRONMENT: "Production"
      # Origin your short URLs render on (must match how users reach the proxy).
      ShortUrl__BaseUrl: "${SHORT_URL_BASE:-http://localhost:8080}"
      # --- Optional: require Microsoft Entra sign-in instead of the open Dev provider ---
      # AzureAd__Instance: "https://login.microsoftonline.com/"
      # AzureAd__TenantId: "<your-tenant-id>"
      # AzureAd__ClientId: "<your-client-id>"
      # Auth__GlobalAdmins__Emails__0: "<your-admin-email>"
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      # To enable Entra sign-in, also pass VITE_ENTRA_CLIENT_ID / VITE_ENTRA_TENANT_ID /
      # VITE_ENTRA_SCOPE here (they are baked into the SPA at build time).
    restart: unless-stopped
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx.proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

networks:
  internal: {}
volumes:
  pgdata: {}
